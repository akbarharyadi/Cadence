# Builds Cadence for Windows, macOS and Linux and attaches the installers to a GitHub Release.
# Run it by pushing a version tag (git tag v0.1.0 && git push origin v0.1.0), or by hand from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libdbus-1-dev pkg-config

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS builds one app for both Apple Silicon and Intel Macs.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Cadence ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: |
            Cadence, a lossless music player for your own files.

            **Download**
            - Windows: the `.exe` installer (`_x64-setup.exe`).
            - macOS (Apple Silicon and Intel): the `.dmg`. The app isn't signed by Apple yet: the first time, right-click Cadence in Applications and choose **Open**.
            - Linux: the `.AppImage` (any distro; make it executable) or the `.deb` (Debian/Ubuntu).

            More at https://cadence.akbarharyadi.com
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
