# Builds Cadence for Windows, macOS, Linux and Android and attaches the installers to a GitHub Release.
# Run it by pushing a version tag (git tag v0.1.0 && git push origin v0.1.0), or by hand from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libdbus-1-dev pkg-config

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Pinned to a commit, the action can't tell the toolchain from its ref: name it.
          toolchain: stable
          # macOS builds one app for both Apple Silicon and Intel Macs.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"

      # The Japanese dictionary (lindera IPADIC), downloaded and built once: see src-tauri/.cargo/config.toml.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: src-tauri/lindera-cache
          key: lindera-ipadic-6.2

      - run: pnpm install --frozen-lockfile

      - name: Open-source license notices (shipped in the app)
        shell: bash
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
          python3 scripts/third-party-notices.py || python scripts/third-party-notices.py

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          notes=$(awk -v v="## $version " 'index($0, v) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md)
          { echo "body<<NOTES_EOF"; echo "$notes"; echo "NOTES_EOF"; } >> "$GITHUB_OUTPUT"

      # Windows: build first and scan the program and installers with Microsoft Defender, so a build
      # it flags is never published (0.2.34's cadence.exe was a false positive, Trojan:Win32/
      # Bearfoos.A!ml, and was removed from users' PCs after updating). tauri-action below reuses
      # this build (cargo has nothing left to compile) and uploads it.
      - name: Build and scan with Microsoft Defender (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Warning "Microsoft Defender isn't on this runner: the build isn't scanned"; exit 0 }
          & $mp -SignatureUpdate | Out-Host
          # Full paths: MpCmdRun can't find a relative one (0x80508023).
          $files = @((Resolve-Path "src-tauri\target\release\cadence.exe").Path) + (Get-ChildItem src-tauri\target\release\bundle -Recurse -Include *.exe, *.msi).FullName
          foreach ($f in $files) {
            $out = (& $mp -Scan -ScanType 3 -File $f -DisableRemediation | Out-String)
            Write-Host $out
            # Its exit code is 2 both for a threat and for a failed scan: read what it says.
            if ($out -match "found no threats") {
              Get-FileHash -Algorithm SHA256 $f | Format-List | Out-Host
            } elseif ($out -match "Threat") {
              Write-Error "Microsoft Defender flags ${f}: not publishing this build"; exit 1
            } else {
              Write-Error "Microsoft Defender couldn't scan ${f} (exit code $LASTEXITCODE): not publishing an unchecked build"; exit 1
            }
          }

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; tauri-action then publishes latest.json for the in-app updater.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Cadence ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: |
            ## What's new
            ${{ steps.notes.outputs.body }}

            ## Download
            Cadence, a lossless music player for your own files.

            - Windows: the `.exe` installer (`_x64-setup.exe`).
            - macOS (Apple Silicon and Intel): the `.dmg`. The app isn't signed by Apple yet: the first time, right-click Cadence in Applications and choose **Open**.
            - Linux: the `.AppImage` (any distro; make it executable) or the `.deb` (Debian/Ubuntu).
            - Android 8 or newer (64-bit phones): the `.apk`. Allow installs from your browser or file manager when asked.

            Already have Cadence 0.2.2 or newer? It updates itself (Settings → Updates).

            More at https://cadence.akbarharyadi.com
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Android: a signed APK for 64-bit ARM phones, added to the same release once the desktop builds made it.
  android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Pinned to a commit, the action can't tell the toolchain from its ref: name it.
          toolchain: stable
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"

      # The Japanese dictionary (lindera IPADIC), downloaded and built once: see src-tauri/.cargo/config.toml.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: src-tauri/lindera-cache
          key: lindera-ipadic-6.2

      - run: pnpm install --frozen-lockfile

      - name: Open-source license notices (shipped in the app)
        shell: bash
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
          python3 scripts/third-party-notices.py

      - name: Build the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CADENCE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CADENCE_KEY_ALIAS: cadence
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export CADENCE_KEYSTORE="$RUNNER_TEMP/release.jks"
          pnpm tauri android build --apk --target aarch64

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          tag="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          tag="${tag:-v$version}"
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          cp "$apk" "Cadence_${version}_android-arm64.apk"
          gh release upload "$tag" "Cadence_${version}_android-arm64.apk" --clobber
