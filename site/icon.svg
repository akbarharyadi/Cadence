<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Cadence app icon: a sound wave that fades out and lands on a gold note (gold is Cadence's
       colour for lossless), on a violet-to-pink tile lit from the top left.
       Rendered to source.png, then `pnpm tauri icon src-tauri/icons/source.png`. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d4dff"/>
      <stop offset="0.5" stop-color="#9b5cf6"/>
      <stop offset="1" stop-color="#ff6fb1"/>
    </linearGradient>
    <radialGradient id="light" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset="0.5" stop-color="#f6cf6f"/>
      <stop offset="1" stop-color="#e3a63c"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#2a0d5c" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="clip"><rect x="32" y="32" width="960" height="960" rx="224"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect x="32" y="32" width="960" height="960" fill="url(#tile)"/>
    <rect x="32" y="32" width="960" height="960" fill="url(#light)"/>
    <circle cx="512" cy="512" r="330" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="5"/>
    <circle cx="512" cy="512" r="420" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="5"/>
  </g>
  <rect x="33.5" y="33.5" width="957" height="957" rx="222.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
  <g filter="url(#shadow)">
