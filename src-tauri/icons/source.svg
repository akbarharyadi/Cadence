<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Cadence app icon: the sidebar's wave mark on an ink tile. Regenerate sizes with `pnpm tauri icon src-tauri/icons/source.png`. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#272a45"/>
      <stop offset="1" stop-color="#10111a"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#ef8fd6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#8b7cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#tile)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#glow)"/>
  <rect x="33.5" y="33.5" width="957" height="957" rx="222.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- Same curve as the sidebar mark (viewBox 0 0 24 24), scaled ×37 and centred. -->
  <g transform="translate(512 540) scale(37) translate(-12 -15)">
    <path d="M3 15c2.5-7 4.5-7 6 0s3.5 7 6 0 3.5-7 6 0" fill="none" stroke="url(#wave)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
