[package]
name = "cadence"
version = "0.2.14"
description = "Cadence — an open-source lossless music player for your own files"
authors = ["Akbar Priyono Haryadi"]
license = "GPL-3.0-only"
repository = "https://github.com/akbarharyadi/cadence"
homepage = "https://cadence.akbarharyadi.com"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cadence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6.1", features = ["all", "opt-simd"] }
cpal = "0.18.2"
ringbuf = "0.5.3"
rubato = "5.0.1"
lofty = "0.25.4"
walkdir = "2.5.0"
crossbeam-channel = "0.5.17"
parking_lot = "0.12.5"
anyhow = "1.0.104"
rayon = "1.12.0"
blake3 = "1.8.7"
log = "0.4.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
tauri-plugin-dialog = "2.8.3"
audioadapter-buffers = "5"
tauri-plugin-log = "2.10.1"
ebur128 = "0.1.10"
souvlaki = "0.8.3"
notify = "8"
notify-debouncer-full = "0.7"
urlencoding = "2.1.3"
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
bliss-audio = { version = "0.13.0", default-features = false, features = ["analysis", "serde"] }
kakasi = "0.1"
pinyin = "0.11"

# Desktop only: one running window at a time (phones manage that themselves).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"

# Secrets go to each system's own store; Direct output (WASAPI exclusive) is Windows-only.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
wasapi = "0.26.0"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Decoding and resampling are slow unoptimized; keep dev builds glitch-free.
[profile.dev.package."*"]
opt-level = 3
